name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [lts/*]

    steps:
      # submodules: recursive is required -- every Solidity dependency
      # (forge-std, openzeppelin-contracts, solidity-bytes-utils) is a gitlink,
      # and actions/checkout defaults to submodules: false, which leaves
      # packages/foundry/lib empty and nothing able to compile.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup node env
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install foundry-toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run foundry tests
        run: yarn foundry:test

      # `yarn chain` runs setup-anvil-wallet first, which DELETES and recreates
      # the scaffold-eth-default keystore before starting anvil. The previous
      # `yarn chain & yarn deploy` raced that window -- deploy read the keystore
      # during the ~94ms in which it did not exist, and failed. Anvil only
      # accepts connections once setup-anvil-wallet has finished, so polling
      # eth_chainId is a sufficient barrier for both the chain and the keystore.
      - name: Start local chain
        run: nohup yarn chain > anvil.log 2>&1 &

      - name: Wait for local chain
        run: |
          for i in $(seq 1 60); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then
              echo "anvil ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "anvil did not become ready within 60s" >&2
          cat anvil.log >&2 || true
          exit 1

      - name: Deploy contracts (& generate contracts typescript output)
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: yarn deploy

      - name: Run nextjs lint
        run: yarn next:lint --max-warnings=0

      - name: Check typings on nextjs
        run: yarn next:check-types
